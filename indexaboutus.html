<!--<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - Scientific Innovations</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary-color: #0077b6;
      --secondary-color: #00b4d8;
      --dark-color: #03045e;
      --light-color: #caf0f8;
      --text-color: #ffffff;
      --box-bg: rgba(0, 0, 0, 0.9);
      --theme-gradient: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background: var(--theme-gradient);
      color: var(--text-color);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      background-color: var(--box-bg);
      padding: 1rem 2rem;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo h1 {
      font-size: 1.5rem;
      background: linear-gradient(to right, var(--light-color), #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
    }

    .nav-links li {
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      background: var(--theme-gradient);
      box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 180, 216, 0.5);
    }

    .section {
      padding: 6rem 2rem 4rem;
    }

    .section-container {
      max-width: 1400px;
      margin: 0 auto;
      background-color: var(--box-bg);
      border-radius: 20px;
      padding: 3rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      text-align: center;
      margin-bottom: 3rem;
      font-size: 2.5rem;
      background: linear-gradient(to right, var(--light-color), #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .about-content {
      display: flex;
      gap: 3rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .about-text {
      flex: 2;
    }

    .about-text p {
      margin-bottom: 1.5rem;
      line-height: 1.8;
      font-size: 1.1rem;
    }

    .about-image {
      flex: 1;
      text-align: center;
    }

    .about-image img {
      max-width: 100%;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      transition: all 0.3s ease;
    }

    .products-grid, .certificates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    .product-card, .certificate {
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 15px;
      padding: 2rem;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .product-card:hover, .certificate:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
    }

    .product-card img, .certificate img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 1.5rem;
    }

    .product-card h3, .certificate h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: var(--light-color);
    }

    .product-card p, .certificate p {
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    footer {
      background-color: var(--box-bg);
      padding: 2rem;
      text-align: center;
      margin-top: 3rem;
    }

    .footer-links, .social-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .footer-links a, .social-links a {
      color: var(--text-color);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .footer-links a:hover, .social-links a:hover {
      color: var(--light-color);
    }

    .social-links a {
      font-size: 1.5rem;
    }

    @media (max-width: 768px) {
      .about-content {
        flex-direction: column;
      }
    }
  </style>
</head>
 
<body>
  <header id="main-header">
    <nav>
      <div class="logo">
        <h1>Scientific Innovations</h1>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="#mission">Our Mission</a></li>
        <li><a href="#team">Our Team</a></li>
        <li><a href="#values">Core Values</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="section" id="mission">
    <div class="section-container">
      <h2 class="section-title">Our Mission</h2>
      <div class="about-content">
        <div class="about-text">
          <p>Our mission is to harness scientific excellence to create impactful innovations. We aim to bridge the gap between research and real-world solutions, contributing to global advancements in science and technology.</p>
          <p>Whether it's enhancing healthcare diagnostics, addressing climate change, or innovating sustainable technologies, our team is passionate about solving complex challenges with elegant solutions.</p>
        </div>
        <div class="about-image">
          <img src="https://via.placeholder.com/500x350" alt="Innovation in Action">
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="team">
    <div class="section-container">
      <h2 class="section-title">Meet Our Team</h2>
      <div class="products-grid">
        <div class="product-card">
          <img src="https://via.placeholder.com/400x250" alt="Dr. Sharma">
          <h3>Dr. Meena Sharma</h3>
          <p>Chief Scientific Officer - 20+ years of leading biotech innovation.</p>
        </div>
        <div class="product-card">
          <img src="https://via.placeholder.com/400x250" alt="John Doe">

          <p>Lead Engineer - Expert in AI, robotics, and automation systems.</p>
        </div>
        <div class="product-card">
          <img src="https://via.placeholder.com/400x250" alt="Priya Kaur">

          <p>Research Analyst - Data-driven decision maker in sustainable tech.</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="values">
    <div class="section-container">
      <h2 class="section-title">Our Core Values</h2>
      <div class="certificates-grid">
        <div class="certificate">
          <i class="fas fa-lightbulb"></i>
          <h3>Innovation</h3>
          <p>We constantly explore new frontiers of science and technology.</p>
        </div>
        <div class="certificate">
          <i class="fas fa-users"></i>
          <h3>Collaboration</h3>
          <p>We work as a team across disciplines and borders.</p>
        </div>
        <div class="certificate">
          <i class="fas fa-handshake"></i>
          <h3>Integrity</h3>
          <p>Ethics and transparency are at the heart of what we do.</p>
        </div>
        <div class="certificate">
          <i class="fas fa-globe"></i>
          <h3>Global Impact</h3>
          <p>Our work benefits communities and ecosystems worldwide.</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="contact">
    <div class="section-container">
      <h2 class="section-title">Get in Touch</h2>
      <div class="about-content">
        <div class="about-text">
          <p>If you have any questions or are interested in collaborating, feel free to contact us. We welcome partnerships, proposals, and scientific dialogue.</p>
          <p><strong>Email:</strong> contact@scientificinnovations.com<br>
          <strong>Phone:</strong> +91-1234567890</p>
        </div>
        <div class="about-image">
          <img src="https://via.placeholder.com/500x350" alt="Contact Team">
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="#mission">Mission</a>
      <a href="#team">Team</a>
      <a href="#values">Values</a>
      <a href="#contact">Contact</a>
    </div>
    <div class="social-links">
      <a href="#"><i class="fab fa-facebook-f"></i></a>

    </div>
    <p>&copy; 2023 Scientific Innovations Inc. All Rights Reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
